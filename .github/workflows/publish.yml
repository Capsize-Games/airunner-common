name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish this source revision to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC); no stored API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
